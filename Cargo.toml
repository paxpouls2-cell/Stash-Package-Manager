[package]
name = "stash"
version = "0.1.0"
edition = "2021"
description = "A simple, modern package manager for CachyOS / Arch"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = true
strip = true
